<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Provider Login</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.panel{max-width:430px;margin:70px auto;background:white;padding:26px;border-radius:12px;box-shadow:0 3px 14px #17203312}label{display:block;font-weight:bold;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:7px;box-sizing:border-box}button{background:#1769aa;color:white;padding:12px 16px;border:0;border-radius:7px;margin-top:18px;cursor:pointer;font-weight:bold}.message{padding:12px;background:#ffeded;color:#8b1e1e;border-radius:8px;margin:12px 0}a{color:#1769aa}</style></head>
<body><main class="panel"><h1>Provider login</h1><p>Only the provider can view customer details and booking records.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Provider password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Log in</button></form><p><a href="{{ url_for('index') }}">Back to public page</a></p></main></body></html>
