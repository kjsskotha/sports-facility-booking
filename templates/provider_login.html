
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provider Login</title>
<style>
body{font-family:Arial;background:#f4f7fb;color:#172033}
main{max-width:430px;margin:70px auto;background:white;padding:26px;border-radius:12px}
label{display:block;margin:14px 0 6px;font-weight:bold}
input{width:100%;padding:12px;box-sizing:border-box}
button{background:#1769aa;color:white;padding:12px 16px;border:0;margin-top:18px;cursor:pointer}
.message{padding:12px;background:#ffeded;margin:12px 0}
</style>
</head>
<body>
<main>
<h1>Provider Login</h1>
<p>Only the provider can view customer details and reports.</p>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="message">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="password">Provider Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Log In</button>
</form>

<p><a href="{{ url_for('index') }}">Back to public page</a></p>
</main>
</body>
</html>
